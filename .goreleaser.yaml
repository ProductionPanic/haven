version: 2

builds:
  - main: ./cmd/haven
    binary: haven
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github

homebrew_casks:
  - name: haven
    binaries: [haven]
    homepage: https://github.com/ProductionPanic/haven
    description: Find and connect to your servers
    directory: Casks
    commit_msg_template: "Update {{ .ProjectName }} to {{ .Tag }}"
    repository:
      owner: ProductionPanic
      name: homebrew-tap
      branch: main
      # Pushed with a deploy key that only has write access to the tap.
      git:
        url: git@github.com:ProductionPanic/homebrew-tap.git
        private_key: "{{ .Env.TAP_DEPLOY_KEY }}"
    hooks:
      post:
        # The binaries aren't Apple-signed; clear the quarantine flag so
        # macOS doesn't block them. Uses Homebrew's install-steps DSL.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/haven"], must_succeed: false
          end
